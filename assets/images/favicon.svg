<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favCalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="favOrbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Calendar Body -->
  <rect x="8" y="10" width="46" height="42" rx="11" fill="url(#favCalGrad)" />
  
  <!-- Top Binder Rings -->
  <rect x="18" y="5" width="5" height="11" rx="2.5" fill="#00D2FF" />
  <rect x="39" y="5" width="5" height="11" rx="2.5" fill="#38BDF8" />

  <!-- Calendar Inner Panel -->
  <rect x="14" y="22" width="34" height="24" rx="5" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Calendar Grid Dots -->
  <rect x="19" y="27" width="5" height="5" rx="1.5" fill="#60A5FA" />
  <rect x="29" y="27" width="5" height="5" rx="1.5" fill="#60A5FA" />
  <rect x="39" y="27" width="5" height="5" rx="1.5" fill="#60A5FA" />
  <rect x="19" y="35" width="5" height="5" rx="1.5" fill="#60A5FA" />
  <rect x="29" y="35" width="5" height="5" rx="1.5" fill="#60A5FA" />
  <rect x="39" y="35" width="5" height="5" rx="1.5" fill="#60A5FA" />

  <!-- Sweeping Orbital Swoosh Arc -->
  <path d="M 5 36 C 2 54, 27 61, 52 52 C 58 49, 62 44, 63 41 C 63 40, 61 41, 59 43 C 41 58, 12 53, 7 38 Z" fill="url(#favOrbitGrad)" />

  <!-- Circular Checkmark Badge -->
  <circle cx="49" cy="46" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5" />
  <path d="M 44.5 46 L 47.5 49 L 53.5 43" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
