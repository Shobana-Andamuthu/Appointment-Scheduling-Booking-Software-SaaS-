<svg viewBox="0 0 250 56" height="48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="SyncPoint Logo">
  <defs>
    <linearGradient id="spCalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="spOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="spGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0066FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .sp-text-sync { fill: #0f172a; }
    .sp-text-point { fill: #0066FF; }
    .sp-pin-fill { fill: #0066FF; }
    .sp-tagline { fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .sp-text-sync { fill: #f8fafc; }
      .sp-tagline { fill: #94a3b8; }
    }
  </style>

  <!-- === CALENDAR ICON WITH PERFECT SMOOTH SWOOSH & BADGE === -->
  <g class="sp-icon-group" filter="url(#spGlow)">
    <!-- Calendar Body -->
    <rect x="8" y="10" width="40" height="36" rx="9" fill="url(#spCalGrad)" />
    
    <!-- Top Binder Rings -->
    <rect x="17" y="5" width="4" height="10" rx="2" fill="#00D2FF" />
    <rect x="33" y="5" width="4" height="10" rx="2" fill="#38BDF8" />

    <!-- Calendar Inner Panel -->
    <rect x="13.5" y="21" width="29" height="19" rx="4" fill="#FFFFFF" fill-opacity="0.96" />
    
    <!-- Calendar Date Grid Dots -->
    <rect x="17.5" y="25" width="4.5" height="4" rx="1.2" fill="#3B82F6" />
    <rect x="25.5" y="25" width="4.5" height="4" rx="1.2" fill="#3B82F6" />
    <rect x="33.5" y="25" width="4.5" height="4" rx="1.2" fill="#3B82F6" />
    <rect x="17.5" y="31" width="4.5" height="4" rx="1.2" fill="#3B82F6" />
    <rect x="25.5" y="31" width="4.5" height="4" rx="1.2" fill="#3B82F6" />
    <rect x="33.5" y="31" width="4.5" height="4" rx="1.2" fill="#3B82F6" />

    <!-- Perfectly Smooth Orbital Swoosh Curve (Stroke Based) -->
    <path d="M 4 33 C 4 48, 22 55, 45 47 C 52 44, 56 39, 57 34" stroke="url(#spOrbitGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Circular Checkmark Badge -->
    <circle cx="44" cy="40" r="8.5" fill="#0066FF" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M 40.5 40 L 43 42.5 L 48 37.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- === TYPOGRAPHY === -->
  <g class="sp-text-group">
    <!-- "Sync" -->
    <text x="64" y="35" font-family="'Outfit', -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.03em" class="sp-text-sync">Sync</text>
    
    <!-- "Po" -->
    <text x="126" y="35" font-family="'Outfit', -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.03em" class="sp-text-point">Po</text>
    
    <!-- 'i' with Location Map Pin Marker -->
    <rect x="160.5" y="21" width="4.5" height="14" rx="1.5" class="sp-pin-fill" fill="#0066FF" />
    <path d="M 162.75 9 C 160.2 9, 158.2 11, 158.2 13.5 C 158.2 16.5, 162.75 19.5, 162.75 19.5 C 162.75 19.5, 167.3 16.5, 167.3 13.5 C 167.3 11, 165.3 9, 162.75 9 Z" class="sp-pin-fill" fill="#0066FF" />
    <circle cx="162.75" cy="13.2" r="1.6" fill="#FFFFFF" />

    <!-- "nt" -->
    <text x="169" y="35" font-family="'Outfit', -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.03em" class="sp-text-point">nt</text>

    <!-- Tagline: Title Case with middle dots -->
    <text x="66" y="49" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.1em" class="sp-tagline">Schedule <tspan fill="#0066FF">•</tspan> Manage <tspan fill="#0066FF">•</tspan> Grow</text>
  </g>
</svg>
